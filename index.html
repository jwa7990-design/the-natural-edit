<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Natural Edit — Enhancing Your Natural Beauty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ============ HEADER / NAV ============ -->
<header class="site-header" id="siteHeader">
  <div class="header-inner">
    <a href="#top" class="logo">THE<br>NATURAL<br>EDIT.</a>

    <nav class="main-nav" id="mainNav">
      <a href="#treatments">Treatments</a>
      <a href="#about">About</a>
      <a href="#results">Results</a>
      <a href="#shop">Shop</a>
      <a href="#book" class="btn-solid nav-book">Book appointment</a>
    </nav>

    <button class="hamburger" id="hamburgerBtn" aria-label="Open menu" aria-expanded="false" aria-controls="mainNav">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main id="top">

  <!-- ============ HERO ============ -->
  <section class="art-section hero-section" id="hero">
    <img src="assets/img/hero.jpg" alt="Enhancing your natural beauty — The Natural Edit" class="art-bg dt-only">
    <img src="assets/img/mobile-hero.jpg" alt="Enhancing your natural beauty — The Natural Edit" class="art-bg mobile-only">

    <div class="hotspot hero-cta-row">
      <a href="#book" class="btn-solid">Make an appointment</a>
      <a href="#treatments" class="link-arrow">Our treatments <span aria-hidden="true">→</span></a>
    </div>
  </section>

  <!-- ============ FEATURES + ABOUT/EXPERIENCE ============ -->
  <section class="art-section about-section" id="about">
    <img src="assets/img/about.jpg" alt="A more personal approach to aesthetics — The Natural Edit" class="art-bg dt-only">
    <img src="assets/img/mobile-about.jpg" alt="A more personal approach to aesthetics — The Natural Edit" class="art-bg mobile-only">

    <div class="hotspot blob-photo dt-only">
      <img src="assets/img/photo-placeholder.jpg" alt="Alisha, founder of The Natural Edit" class="blob-img">
    </div>
  </section>

  <!-- ============ TREATMENTS + RESULTS COMBINED (desktop) ============ -->
  <section class="art-section treatments-results-section dt-only" id="treatments">
    <img src="assets/img/treatments-desktop.jpg" alt="Refine. Restore. Enhance. Real results — subtle changes, powerful confidence. Let's create a plan that's right for you." class="art-bg">

    <span id="results" class="anchor-mark"></span>
  </section>

  <!-- ============ TREATMENTS + RESULTS COMBINED (mobile only) ============ -->
  <section class="art-section treatments-results-mobile mobile-only">
    <img src="assets/img/mobile-treatments.jpg" alt="Refine. Restore. Enhance. Real results — subtle changes, powerful confidence. Let's create a plan that's right for you." class="art-bg">

    <a href="#book" class="hotspot mobile-book-now">Book now</a>
  </section>

  <!-- ============ FOOTER ============ -->
  <footer class="art-section site-footer" id="book">
    <img src="assets/img/footer-desktop.jpg" alt="The Natural Edit — Enhancing natural beauty with expert care and a personal touch." class="art-bg dt-only">
    <img src="assets/img/mobile-footer.jpg" alt="The Natural Edit — Subtle. Natural. Confident." class="art-bg mobile-only">

    <!-- Desktop link columns (headers + branding + copyright are baked into the art) -->
    <div class="hotspot footer-col-links dt-only col-quicklinks">
      <a href="#treatments">Treatments</a>
      <a href="#about">About</a>
      <a href="#results">Results</a>
      <a href="#shop">Shop</a>
    </div>

    <div class="hotspot footer-col-links dt-only col-information">
      <a href="#faq">FAQ</a>
      <a href="#aftercare">Aftercare</a>
      <a href="#gift-cards">Gift cards</a>
      <a href="#privacy">Privacy policy</a>
      <a href="#terms">Terms &amp; conditions</a>
    </div>

    <div class="hotspot footer-col-links dt-only col-connect">
      <div class="social-icons">
        <a href="#" aria-label="Instagram">IG</a>
        <a href="#" aria-label="Facebook">FB</a>
        <a href="#" aria-label="Pinterest">PIN</a>
      </div>
    </div>

    <div class="hotspot footer-col-links dt-only col-booking">
      <a href="#book" class="btn-outline-dark">Book appointment</a>
      <p class="footer-contact">02 5124 3476<br>info@thenaturaledit.com.au</p>
    </div>

    <!-- Mobile nav rows (labels + chevrons are baked into the art) -->
    <a href="#about" class="hotspot mobile-footer-row row-1 mobile-only" aria-label="About"></a>
    <a href="#treatments" class="hotspot mobile-footer-row row-2 mobile-only" aria-label="Treatments"></a>
    <a href="#results" class="hotspot mobile-footer-row row-3 mobile-only" aria-label="Results"></a>
  </footer>

</main>

<script src="assets/script.js"></script>
</body>
</html>
